name: Weekly 24-hour soak

on:
  schedule:
    - cron: "17 1 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-24h-soak
  cancel-in-progress: false

jobs:
  soak:
    name: Dual-runtime max-concurrency soak
    runs-on: [self-hosted, linux, voicekit-soak]
    timeout-minutes: 1560
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv==0.11.7
      - name: Sync locked runtime environment
        run: uv sync --frozen --extra pipecat --extra livekit
      - name: Run the full wall-clock soak
        run: |
          uv run python tests/verification/p4_soak.py \
            --duration-s 86400 \
            --max-concurrent 8 \
            --call-hold-s 1 \
            --runtime both \
            --report p4-soak-report.json
      - name: Upload the soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-24h-soak-report
          path: p4-soak-report.json
          if-no-files-found: error
