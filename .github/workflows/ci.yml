name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify package entry point
        run: |
          node --input-type=module -e 'import pkg from "./index.js"; import manifest from "./package.json" with { type: "json" }; if (pkg.name !== manifest.name || pkg.version !== manifest.version) process.exit(1)'

      - name: Verify package contents
        run: npm pack --dry-run
