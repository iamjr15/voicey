name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install uv
        run: python -m pip install uv==0.11.7
      - name: Sync locked environment
        run: uv sync --frozen --all-extras
      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.72.0
      - name: Build unpublished engine wheel
        run: uv build --wheel --out-dir dist
      - name: Run signature, leak, dependency, and canonical-image security gate
        run: |
          uv run python tests/verification/run_p4_security_gate.py \
            --wheel dist/voicey-0.0.0.dev0-py3-none-any.whl \
            --report p4-security-report.json
      - name: Upload truthful security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-security-report
          path: p4-security-report.json
          if-no-files-found: error
