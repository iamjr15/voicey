name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        run: python -m pip install uv==0.11.7
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Secret scan
        run: uv run detect-secrets-hook --baseline .secrets.baseline $(git ls-files)
      - name: Dependency audit
        run: uv run pip-audit --local --skip-editable
