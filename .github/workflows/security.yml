name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install uv
        run: python -m pip install uv==0.11.7
      - name: Sync locked environment
        run: uv sync --frozen --all-extras
      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: v0.72.0
      - name: Build unpublished engine wheel
        id: wheel
        run: |
          uv build --wheel --out-dir dist
          wheel="$(find dist -maxdepth 1 -name '*.whl' -type f)"
          test -n "$wheel"
          test "$(find dist -maxdepth 1 -name '*.whl' -type f | wc -l | tr -d ' ')" = "1"
          echo "path=$wheel" >> "$GITHUB_OUTPUT"
      - name: Run signature, leak, dependency, and canonical-image security gate
        run: |
          uv run python tests/verification/run_p4_security_gate.py \
            --wheel "${{ steps.wheel.outputs.path }}" \
            --report p4-security-report.json
      - name: Upload truthful security report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p4-security-report
          path: p4-security-report.json
          if-no-files-found: error
