name: Release to PyPI

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Artifact channel; stable requires a prior green canary run"
        required: true
        type: choice
        options:
          - canary
          - stable
      ref:
        description: "Exact release tag, for example refs/tags/v1.0.0rc1"
        required: true
        type: string
      canary_run_id:
        description: "Required for stable: this workflow's green canary run id"
        required: false
        type: string

permissions: {}

concurrency:
  group: pypi-${{ inputs.channel }}-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Build and verify release artifacts
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv==0.11.7
      - name: Validate immutable release tag and channel
        id: release
        env:
          CANARY_RUN_ID: ${{ inputs.canary_run_id }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          version="$(python - <<'PY'
          import pathlib
          import tomllib

          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"
          test "$RELEASE_REF" = "refs/tags/v$version"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_REF")"
          python - "$version" "$RELEASE_CHANNEL" <<'PY'
          import re
          import sys

          version = sys.argv[1]
          channel = sys.argv[2]
          stable = re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version)
          canary = re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:a|b|rc)[0-9]+", version)
          if channel == "canary" and canary is None:
              raise SystemExit("canary tags must contain a PEP 440 prerelease version")
          if channel == "stable" and stable is None:
              raise SystemExit("stable tags must contain a final PEP 440 version")
          PY
          if [ "$RELEASE_CHANNEL" = "stable" ]; then
            [[ "$CANARY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          fi
          artifact_name="voicey-${RELEASE_CHANNEL}-${GITHUB_RUN_ID}"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Sync locked release environment
        run: uv sync --frozen --extra pipecat --extra livekit
      - name: Build wheel and source distribution
        run: uv build --out-dir dist
      - name: Resolve the one wheel and source distribution
        id: artifact
        run: |
          wheel_count="$(find dist -maxdepth 1 -name '*.whl' -type f | wc -l | tr -d ' ')"
          sdist_count="$(find dist -maxdepth 1 -name '*.tar.gz' -type f | wc -l | tr -d ' ')"
          test "$wheel_count" = "1"
          test "$sdist_count" = "1"
          echo "wheel=$(find dist -maxdepth 1 -name '*.whl' -type f)" >> "$GITHUB_OUTPUT"
      - name: Download prior canary evidence
        if: inputs.channel == 'stable'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: voicey-canary-${{ inputs.canary_run_id }}
          path: canary-evidence
          run-id: ${{ inputs.canary_run_id }}
          github-token: ${{ github.token }}
      - name: Validate canary artifact
        if: inputs.channel == 'canary'
        run: |
          uv run python tests/verification/run_p4_release_gate.py \
            --wheel "${{ steps.artifact.outputs.wheel }}" \
            --channel canary \
            --report p4-release-report.json
      - name: Validate stable promotion against canary evidence
        if: inputs.channel == 'stable'
        run: |
          uv run python tests/verification/run_p4_release_gate.py \
            --wheel "${{ steps.artifact.outputs.wheel }}" \
            --channel stable \
            --canary-report canary-evidence/p4-release-report.json \
            --report p4-release-report.json
      - name: Assemble checksummed release bundle
        run: |
          mkdir -p release-bundle/dist
          cp dist/* release-bundle/dist/
          cp p4-release-report.json release-bundle/
          cd release-bundle
          sha256sum dist/* p4-release-report.json > SHA256SUMS
      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish stable release to PyPI
    if: inputs.channel == 'stable'
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/voicey
    permissions:
      id-token: write
    steps:
      - name: Download the verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: release-bundle
      - name: Verify release bundle integrity
        working-directory: release-bundle
        run: |
          sha256sum --check SHA256SUMS
          test "$(find dist -maxdepth 1 -name '*.whl' -type f | wc -l | tr -d ' ')" = "1"
          test "$(find dist -maxdepth 1 -name '*.tar.gz' -type f | wc -l | tr -d ' ')" = "1"
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release-bundle/dist/
          attestations: true
          print-hash: true
          skip-existing: false
