name: Runtime compatibility edges

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "src/voicey/compatibility.py"
      - "tests/verification/canary_recipes.py"
      - ".github/workflows/runtime-edges.yml"
  schedule:
    - cron: "23 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certified-edge:
    name: ${{ matrix.runtime }} ${{ matrix.version }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
        runtime: ["pipecat", "livekit"]
        include:
          - runtime: pipecat
            distribution: pipecat-ai
            version: "1.6.0"
          - runtime: livekit
            distribution: livekit-agents
            version: "1.6.7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install uv==0.11.7
      - name: Sync both pinned native runtimes
        run: uv sync --frozen --extra pipecat --extra livekit
      - name: Install the declared edge exactly
        run: |
          uv pip install --python .venv/bin/python \
            "${{ matrix.distribution }}==${{ matrix.version }}"
      - name: Assert installed edge is certified
        env:
          VOICEY_EDGE_RUNTIME: ${{ matrix.runtime }}
          VOICEY_EDGE_VERSION: ${{ matrix.version }}
        run: |
          uv run --no-sync python - <<'PY'
          import importlib.metadata
          import os
          from voicey.compatibility import inspect_runtime_compatibility

          runtime = os.environ["VOICEY_EDGE_RUNTIME"]
          expected = os.environ["VOICEY_EDGE_VERSION"]
          report = inspect_runtime_compatibility(runtime)
          assert report.installed_version == expected, report
          assert report.status == "supported", report
          print(f"{runtime} {expected} is inside {report.supported_range}")
          PY
      - name: Exercise all first-party recipes on the edge
        run: |
          uv run --no-sync python tests/verification/canary_recipes.py \
            --runtime "${{ matrix.runtime }}" \
            --report "runtime-edge-${{ matrix.runtime }}-${{ matrix.python }}.json"
      - name: Upload edge evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-edge-${{ matrix.runtime }}-${{ matrix.python }}
          path: runtime-edge-*.json
          if-no-files-found: error
