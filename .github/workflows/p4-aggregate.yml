name: P4 Aggregate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-aggregate:
    name: Complete credential-free P0-P4 regression
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: voicekit
          POSTGRES_PASSWORD: voicekit-test # pragma: allowlist secret
          POSTGRES_DB: voicekit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voicekit -d voicekit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      VOICEKIT_TEST_POSTGRES_DSN: postgresql://voicekit:voicekit-test@127.0.0.1:5432/voicekit # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install uv
        run: python -m pip install uv==0.11.7
      - name: Sync complete locked environment
        run: uv sync --frozen --all-extras
      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.72.0
      - name: Build release-shaped wheel
        run: uv build --wheel --out-dir dist
      - name: Run truthful aggregate
        run: |
          uv run python tests/verification/run_p4_gate.py \
            --wheel dist/voicekit-0.0.0.dev0-py3-none-any.whl \
            --short-soak-s 30 \
            --max-concurrent 8 \
            --report p4-gate-report.json
      - name: Upload every child report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-aggregate-reports
          path: |
            p4-gate-report.json
            p3-from-p4-report.json
            p4-hardening-report.json
            p4-short-soak-report.json
            p4-observability-report.json
            p4-railway-report.json
            p4-upgrade-report.json
            p4-release-report.json
            p4-docs-report.json
            p4-docs-quickstarts.json
            p4-security-report.json
          if-no-files-found: warn
