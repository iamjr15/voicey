name: P4 Aggregate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-aggregate:
    name: Complete credential-free P0-P4 regression
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: voicey
          POSTGRES_PASSWORD: voicey-test # pragma: allowlist secret
          POSTGRES_DB: voicey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voicey -d voicey"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      VOICEY_TEST_POSTGRES_DSN: postgresql://voicey:voicey-test@127.0.0.1:5432/voicey # pragma: allowlist secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install uv
        run: python -m pip install uv==0.11.7
      - name: Sync complete locked environment
        run: uv sync --frozen --all-extras
      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.72.0
      - name: Build release-shaped wheel
        id: wheel
        run: |
          uv build --wheel --out-dir dist
          wheel="$(find dist -maxdepth 1 -name '*.whl' -type f)"
          test -n "$wheel"
          test "$(find dist -maxdepth 1 -name '*.whl' -type f | wc -l | tr -d ' ')" = "1"
          echo "path=$wheel" >> "$GITHUB_OUTPUT"
      - name: Run truthful aggregate
        run: |
          uv run python tests/verification/run_p4_gate.py \
            --wheel "${{ steps.wheel.outputs.path }}" \
            --short-soak-s 30 \
            --max-concurrent 8 \
            --report .voicey/verification/p4-gate-report.json
      - name: Upload every child report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p4-aggregate-reports
          path: .voicey/verification/*.json
          if-no-files-found: warn
