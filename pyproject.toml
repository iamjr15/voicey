[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "voicekit"
version = "0.0.0.dev0"
description = "Production-grade dual-runtime voice-agent toolchain for Pipecat and LiveKit"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
authors = [{ name = "voicekit contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Framework :: FastAPI",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "aiosqlite>=0.22,<1",
  "fastapi>=0.138,<1",
  "httpx>=0.28,<1",
  "json5>=0.13,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
  "questionary==2.1.1",
  "rich>=15,<16",
  "structlog>=25.5,<26",
  "typer==0.27.0",
  "uvicorn[standard]>=0.40,<1",
  "watchfiles>=1.1,<2",
]

[project.optional-dependencies]
pipecat = ["pipecat-ai[webrtc,websocket]==1.6.0"]
livekit = ["livekit-agents==1.6.7", "livekit-api==1.2.0"]

[project.scripts]
voicekit = "voicekit.cli.app:app"

[project.entry-points."voicekit.telephony"]

[project.entry-points."voicekit.providers"]

[dependency-groups]
dev = [
  "detect-secrets>=1.5,<2",
  "pip-audit>=2.9,<3",
  "pre-commit>=4.3,<5",
  "pyright>=1.1.403,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voicekit"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
  "ASYNC",
  "B",
  "E",
  "F",
  "I",
  "PT",
  "RUF",
  "SIM",
  "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv"]
pythonVersion = "3.11"
pythonPlatform = "All"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=voicekit",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
  "-ra",
]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: mocked integration tests that may start local services",
  "live: credentialed or paid external-provider tests",
  "slow: wall-clock intensive tests",
]
