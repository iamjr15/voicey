[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "voicekit"
version = "0.0.0.dev0"
description = "Production-grade dual-runtime voice-agent toolchain for Pipecat and LiveKit"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
authors = [{ name = "voicekit contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Framework :: FastAPI",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "aiosqlite>=0.22,<1",
  "fastapi>=0.138,<1",
  "httpx>=0.28,<1",
  "json5>=0.13,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
  "questionary==2.1.1",
  "rich>=13.9.4,<16",
  "structlog>=25.5,<26",
  "typer==0.27.0",
  "uvicorn[standard]>=0.40,<1",
  "watchfiles>=1.1,<2",
  "websockets>=13.1,<17",
]

[project.optional-dependencies]
pipecat = ["pipecat-ai[anthropic,cartesia,deepgram,evals,google,webrtc,websocket]==1.6.0"]
livekit = [
  "livekit-agents[anthropic,cartesia,deepgram,elevenlabs,google,openai,silero]==1.6.7",
  "livekit-api==1.2.0",
]
twilio = ["python-multipart>=0.0.22,<1", "twilio==9.10.9"]
telnyx = ["cryptography>=49,<50", "python-multipart>=0.0.22,<1"]
vobiz = ["python-multipart>=0.0.22,<1"]
plivo = ["plivo==4.61.0", "python-multipart>=0.0.22,<1"]
tunnel = ["ngrok==1.4.0"]
cloud = [
    "boto3>=1.40,<2",
    "psycopg[binary,pool]>=3.2.10,<4",
]

[project.scripts]
voicekit = "voicekit.cli.app:app"

[project.entry-points."voicekit.telephony"]
twilio = "voicekit.telephony.twilio:TwilioAdapter"
telnyx = "voicekit.telephony.telnyx:TelnyxAdapter"
vobiz = "voicekit.telephony.vobiz:VobizAdapter"
plivo = "voicekit.telephony.plivo:PlivoAdapter"

[project.entry-points."voicekit.providers"]

[dependency-groups]
dev = [
  "detect-secrets>=1.5,<2",
  "hatchling>=1.28,<2",
  "pip-audit>=2.9,<3",
  "pre-commit>=4.3,<5",
  "pyright>=1.1.403,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.12,<1",
  "standardwebhooks==1.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voicekit"]

[tool.hatch.build.targets.wheel.force-include]
"recipes/appointment-booking" = "voicekit/recipe_data/appointment-booking"
"recipes/front-desk" = "voicekit/recipe_data/front-desk"
"recipes/lead-intake" = "voicekit/recipe_data/lead-intake"
"recipes/restaurant-reservations" = "voicekit/recipe_data/restaurant-reservations"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
  "ASYNC",
  "B",
  "E",
  "F",
  "I",
  "PT",
  "RUF",
  "SIM",
  "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv"]
pythonVersion = "3.11"
pythonPlatform = "All"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=voicekit",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
  "-ra",
]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: mocked integration tests that may start local services",
  "live: credentialed or paid external-provider tests",
  "slow: wall-clock intensive tests",
]

[tool.coverage.run]
omit = [
  "src/voicekit/_p0/*",
  # Required Postgres 17 CI covers these optional managed backends separately.
  "src/voicekit/relay/postgres.py",
  "src/voicekit/storage/postgres.py",
]
