[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "voicey"
version = "1.0.0"
description = "Production-grade dual-runtime voice-agent toolchain for Pipecat and LiveKit"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
authors = [{ name = "voicey contributors" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Framework :: FastAPI",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "aiosqlite>=0.22,<1",
  "fastapi>=0.138,<1",
  "httpx>=0.28,<1",
  "json5>=0.13,<1",
  "opentelemetry-api>=1.39,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
  "opentelemetry-sdk>=1.39,<2",
  "packaging>=25,<27",
  "prometheus-client>=0.26,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
  "questionary==2.1.1",
  "rich>=13.9.4,<16",
  "structlog>=25.5,<27",
  "typer==0.27.1",
  "uvicorn[standard]>=0.40,<1",
  "watchfiles>=1.1,<2",
  "websockets>=13.1,<18",
]

[project.optional-dependencies]
pipecat = [
  "nltk>=3.10.2,<4",
  "pipecat-ai[anthropic,cartesia,daily,deepgram,evals,google,webrtc,websocket]==1.7.0",
]
livekit = [
  "anthropic==1.0.0",
  "livekit-agents[anthropic,cartesia,deepgram,elevenlabs,google,openai,silero]==1.7.0",
  "livekit-api==1.2.0",
]
twilio = ["python-multipart>=0.0.22,<1", "twilio==9.11.0"]
telnyx = ["cryptography>=50,<51", "python-multipart>=0.0.22,<1"]
vobiz = ["python-multipart>=0.0.22,<1"]
plivo = ["plivo==4.62.0", "python-multipart>=0.0.22,<1"]
tunnel = ["ngrok==1.4.0"]
cloud = [
    "boto3>=1.40,<2",
    "psycopg[binary,pool]>=3.2.10,<4",
]
companion = [
    "boto3>=1.40,<2",
    "cryptography>=50,<51",
    "plivo==4.62.0",
    "psycopg[binary,pool]>=3.2.10,<4",
    "python-multipart>=0.0.22,<1",
    "twilio==9.11.0",
]

[project.scripts]
voicey = "voicey.cli.app:app"

[project.entry-points."voicey.telephony"]
twilio = "voicey.telephony.twilio:TwilioAdapter"
telnyx = "voicey.telephony.telnyx:TelnyxAdapter"
vobiz = "voicey.telephony.vobiz:VobizAdapter"
plivo = "voicey.telephony.plivo:PlivoAdapter"

[project.entry-points."voicey.providers"]

[dependency-groups]
dev = [
  "detect-secrets>=1.5,<2",
  "hatchling>=1.28,<2",
  "pip>=26.2,<27",
  "pip-audit>=2.9,<3",
  "pre-commit>=4.3,<5",
  "pyright>=1.1.403,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.12,<1",
  "standardwebhooks==1.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voicey"]

[tool.hatch.build.targets.wheel.force-include]
"recipes/appointment-booking" = "voicey/recipe_data/appointment-booking"
"recipes/front-desk" = "voicey/recipe_data/front-desk"
"recipes/lead-intake" = "voicey/recipe_data/lead-intake"
"recipes/restaurant-reservations" = "voicey/recipe_data/restaurant-reservations"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
  "ASYNC",
  "B",
  "E",
  "F",
  "I",
  "PT",
  "RUF",
  "SIM",
  "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv"]
pythonVersion = "3.11"
pythonPlatform = "All"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=voicey",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
  "-ra",
]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: mocked integration tests that may start local services",
  "live: credentialed or paid external-provider tests",
  "slow: wall-clock intensive tests",
]

[tool.coverage.run]
omit = [
  "src/voicey/_p0/*",
  # Required Postgres 17 CI covers these optional managed surfaces separately.
  "src/voicey/deploy/managed.py",
  "src/voicey/deploy/results_service.py",
  "src/voicey/relay/postgres.py",
  "src/voicey/storage/postgres.py",
]
