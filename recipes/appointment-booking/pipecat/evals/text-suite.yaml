concurrency: 2
runs_dir: eval-runs/text
bots_dir: ..
scenarios_dir: text
base_port: 7860
timeout: 20
spawn: "{python} {bot} -t eval --port {port}"
suite:
  - bot: eval_bot.py
    scenarios:
      - book
      - change-mind
      - cancel
      - barge-in
      - calendar-failure
      - voicemail
      - human-transfer
